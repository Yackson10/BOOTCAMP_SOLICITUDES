server:
  port: 8081
spring:
  application:
    name: "CrediYA"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  mysql:
    url: "r2dbc:mysql://localhost:3307/bd_solicitudes"
    usr: "myroot"
    psw: "myroot123"
  rest-users:
    timeout: 5000
    url: "http://localhost:8080/api/v1/credi-ya/user/document/"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

entries:
  web:
    path-base: "${PATH_BASE:/api/v1/solicitud}"
    path-solicitudes: "${PATH_SOLICITUD:/solicitud}"
    save: "/save"
